name: smc-mtf
on:
  workflow_dispatch:
  push:
    branches: ['smc/**']
    paths: ['smc/**', '.github/workflows/smc.yml']
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - uses: actions/cache@v4
        with:
          path: smc_data
          key: smc-15m-24sym-2021-10-2026-10-v1
      - name: Fetch 15m archives (SHA256 verified)
        run: |
          if [ ! -f smc_data/receipt.csv ]; then python -u smc/fetch15.py --out smc_data; fi
          tail -n +2 smc_data/receipt.csv | awk -F, '{print $3}' | sort | uniq -c
      - name: Backtest
        run: python -u smc/amd_vwap.py smc_data
      - run: cat smc_out/AMD_VWAP.md >> "$GITHUB_STEP_SUMMARY"
