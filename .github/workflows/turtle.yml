name: turtle
on:
  workflow_dispatch:
  push:
    branches: ['auto/turtle']
    paths: ['turtle/**', '.github/workflows/turtle.yml']
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - run: python -u turtle/fetch.py turtle_data && python -u turtle/backtest.py turtle_data
      - uses: actions/cache@v4
        with:
          path: all_data
          key: turtle-1d-all-usdtm-2020-09-2026-10-v1
      - run: if [ ! -f all_data/BTCUSDT_1d.csv ]; then python -u turtle/fetch_all.py all_data; fi; ls all_data | wc -l
      - run: python -u turtle/robust.py turtle_data all_data
      - run: cat turtle_out/REPORT.md turtle_out/ROBUST.md >> "$GITHUB_STEP_SUMMARY"
