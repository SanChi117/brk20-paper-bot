name: tgscreen
on:
  workflow_dispatch:
  push:
    branches: ['tgscreen']
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 numpy
      - uses: actions/cache@v4
        with:
          path: tg_raw
          key: tgraw-v1-${{ github.run_id }}
          restore-keys: tgraw-v1-
      - uses: actions/cache@v4
        with:
          path: kl_cache
          key: tgkl-v1-${{ github.run_id }}
          restore-keys: tgkl-v1-
      - run: python -u tgscreen/scrape.py tgscreen/channels.txt tg_raw 2024-11-24
      - run: python -u tgscreen/screen.py tg_raw kl_cache tg_out
      - run: cat tg_out/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - run: python -c "import json;d=json.load(open('tg_out/detail.json'));print(json.dumps(d,ensure_ascii=False)[:60000])"
