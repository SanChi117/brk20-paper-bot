name: filters
on:
  workflow_dispatch:
  push:
    branches: ['mme/label-study']
    paths: ['p2/filters.py', '.github/workflows/filters.yml']
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas
      - uses: actions/cache@v4
        with: {path: mme_data, key: mme-1h-oicontracts-funding-24sym-2021-10-2026-10-v2}
      - uses: actions/cache@v4
        with: {path: ml_data, key: ml-metrics-premium-24sym-2021-12-2026-10-v1}
      - uses: actions/cache@v4
        with: {path: oos_data, key: oos-1h-30sym-2021-10-2026-10-v1}
      - uses: actions/cache@v4
        with: {path: oos_ml, key: oos-metrics-30sym-2021-12-2026-10-v1}
      - run: |
          if [ ! -f oos_ml/XLMUSDT_metrics.csv ]; then python -u ml/fetch_extra.py oos_ml XLMUSDT,EOSUSDT,ALGOUSDT,SANDUSDT,MANAUSDT,AXSUSDT,CRVUSDT,SNXUSDT,MKRUSDT,COMPUSDT,GRTUSDT,ICPUSDT,EGLDUSDT,HBARUSDT,VETUSDT,THETAUSDT,RUNEUSDT,DYDXUSDT,GALAUSDT,CHZUSDT,KAVAUSDT,1INCHUSDT,IMXUSDT,LDOUSDT,STXUSDT,FETUSDT,WLDUSDT,SEIUSDT,TIAUSDT,ORDIUSDT; fi
      - run: python -u p2/filters.py mme_data ml_data oos_data oos_ml
      - run: cat p2_out/FILTERS.md >> "$GITHUB_STEP_SUMMARY"
